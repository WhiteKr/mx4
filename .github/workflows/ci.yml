name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck -S warning install.sh tests/gnome-smoke/run.sh
      - run: cp gnome-extension/extension.js /tmp/extension.mjs && node --check /tmp/extension.mjs

  gnome-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: cargo build --locked --release
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnome-shell python3-dbus python3-gi gir1.2-gtk-4.0 dconf-cli
      - run: sudo tests/gnome-smoke/run.sh
