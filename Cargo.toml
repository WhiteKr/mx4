[workspace]
resolver = "3"
members = ["crates/mx4-core", "crates/mx4-haptic", "crates/mx4d"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/WhiteKr/mx4"

[workspace.dependencies]
mx4-core = { path = "crates/mx4-core" }
mx4-haptic = { path = "crates/mx4-haptic" }
anyhow = "1.0.104"
futures-util = "0.3.34"
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "signal", "time", "sync"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
clap = { version = "4.6.8", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
